<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile-first and phone-only in practice. viewport-fit=cover so the
         safe-area insets in styles.css have an effect on notched screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest for the home screen icon, so it needs its own
         link. 180x180 is what it wants; anything else gets rescaled. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Order Ops" />
    <title>Order Ops</title>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
